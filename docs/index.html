<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>G5 - Projeto Governo Eletrônico</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="custom.css">
</head>
<body>
  <header class="gov-header" aria-label="Identificação do projeto">
    <div class="gov-header__inner">
      <span class="gov-header__brand">Governo Federal</span>
      <span class="gov-header__project">Informa.BR | Projeto Governo Eletrônico</span>
      <button class="theme-toggle" type="button" aria-pressed="false">Tema escuro</button>
    </div>
  </header>
  <div id="app"></div>
  <script>
    const themeToggle = document.querySelector('.theme-toggle');
    const savedTheme = localStorage.getItem('theme');

    if (savedTheme === 'dark') {
      document.body.classList.add('dark-theme');
      themeToggle.setAttribute('aria-pressed', 'true');
      themeToggle.textContent = 'Tema claro';
    }

    themeToggle.addEventListener('click', () => {
      const isDark = document.body.classList.toggle('dark-theme');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      themeToggle.setAttribute('aria-pressed', String(isDark));
      themeToggle.textContent = isDark ? 'Tema claro' : 'Tema escuro';
    });

    window.$docsify = {
      name: 'G5 - Projeto Governo Eletrônico',
      repo: 'https://github.com/UnBArqDsw2026-2-Turma02/2026.2-T02-_G5_ProjetoGovernoEletronico_Entrega_02',
      homepage: 'README.md',
      loadSidebar: true,
      subMaxLevel: 3,
      sidebarDisplayLevel: 1
    };
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
